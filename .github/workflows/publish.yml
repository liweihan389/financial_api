name: Test, build and publish data-free images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: financial-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt .
      - run: python scripts/check_publication.py
      - run: python -m pytest -q
      - id: version
        run: python -c "import tomllib; print('value='+tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: financial-api:test
          build-args: |
            VERSION=${{ needs.test.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Empty database, import and persistence acceptance
        run: python3 scripts/container_smoke.py --image financial-api:test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image and prepare offline image archive
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ needs.test.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag financial-api:test "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"
          mkdir -p artifacts
          docker save "$IMAGE:$VERSION-$ARCH" | gzip -1 > "artifacts/financial-api-$VERSION-linux-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.arch }}
          path: artifacts/*.tar.gz
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: artifacts
          merge-multiple: true
      - name: Package source and plugin without datasets
        run: |
          mkdir -p release
          git archive --format=zip -o release/financial-api-source.zip HEAD
          python3 -c "import shutil; shutil.make_archive('release/financial-api-plugin','zip','plugin')"
          cp artifacts/*.tar.gz release/
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish prebuilt Docker archives on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Financial API $VERSION" --notes "Data-free application, plugin, and prebuilt Docker images for Linux amd64 and arm64. Import your own Compustat/CRSP files after startup. SHA256SUMS verifies every downloadable archive."
          gh release upload "v$VERSION" release/* --clobber
