[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-fundamentals"
version = "0.3.1"
description = "Auditable Compustat quarterly research database, REST API and MCP tools"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27", "psutil>=6"]

[project.scripts]
financial-data = "fundamentals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fundamentals = ["price_currency_evidence.json", "share_basis_evidence.json", "static/*.html", "sec_rules.json", "sec_policy.json", "compustat_schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
